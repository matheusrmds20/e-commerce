[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bookcommerce-backend"
version = "0.1.0"
description = "E-commerce de livros - Backend API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "BookCommerce" },
]

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Database
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",

    # Validação e settings
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "email-validator>=2.1.0",

    # Segurança
    # pwdlib[argon2] gera os hashes de senha ($argon2id$) usados em
    # app/core/security.py via PasswordHash.recommended(). O extra [argon2]
    # traz o argon2-cffi; sem ele, o hash quebra em runtime.
    "python-jose[cryptography]>=3.3.0",
    "pwdlib[argon2]>=0.2.0",
    "bcrypt>=4.1.0",

    # Pagamentos (SDK do Mercado Pago — app/integrations/MercadoPago/geteway.py)
    "mercadopago>=2.2.0",

    # Integração com a API do Melhor Envio — app/integrations/MelhorEnvio/gateway.py
    "httpx>=0.27.0",

    # Upload / form data
    "python-multipart>=0.0.9",

    # Rate limiting
    "slowapi>=0.1.9",

    # Fila assíncrona (worker de e-mail)
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",

    # Geração de PDF (comprovante de pedido)
    "reportlab>=4.2.0",

    # Utilitários
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "factory-boy>=3.3.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=app --cov-report=term-missing -m \"not integration\""
pythonpath = ["."]
markers = [
    "integration: requer um banco PostgreSQL real (bookcommerce_conc) e saindo da suíte padrão. Rode com -m integration",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = ["E501"]  # line length handled by black

[tool.ruff.lint.per-file-ignores]
# app/schemas/__init__.py reexporta os schemas com `from .x import *` de forma
# deliberada, para que `from app.schemas import X` funcione de qualquer módulo.
# Os star imports são intencionais: F403 (import *) e F401 (import não usado)
# não se aplicam a um módulo de reexport.
"app/schemas/__init__.py" = ["F403", "F401"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]