name: CI

on:
  push:
    branches: [main, Frontend]
  pull_request:
    branches: [main, Frontend]
  workflow_dispatch:

# Cancela execuções antigas do mesmo branch quando um push novo chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        # A suíte usa sqlite em memória e uma SECRET_KEY de teste definidas em
        # tests/conftest.py — não precisa de Postgres, Redis nem segredos.
        # Os testes marcados como `integration` exigem Postgres real e são
        # deselecionados por padrão via addopts em pyproject.toml.
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Papiro

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/Papiro/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build
