name: CI

on:
  push:
    branches: [main, Frontend]
  pull_request:
    branches: [main, Frontend]
  workflow_dispatch:

# Serializa execuções do mesmo branch SEM cancelar as que já estão rodando.
# Com cancel-in-progress: true, empurrar `Frontend` e `main` em sequência (ou
# corrigir um commit logo depois) matava o run anterior no meio — e o job E2E,
# que depende de backend+frontend, era marcado como 'skipped' por ter os pais
# cancelados. Agora o run novo espera na fila e nenhum resultado é perdido.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    env:
      # Settings (app/core/config.py) exige estas variáveis sem default.
      # Localmente elas vêm do backend/.env; no CI esse arquivo não existe
      # (é ignorado pelo git), então precisam ser definidas aqui.
      # Valores fictícios: a suíte usa sqlite em memória (tests/conftest.py)
      # e não chama nenhum serviço externo real.
      # Aspas obrigatórias: em YAML, ':' dentro do valor quebra o parse
      # (ex.: sqlite:///:memory: ou host:porta). Sempre citar URL/DSN.
      DATABASE_URL: "sqlite:///:memory:"
      FRONTEND_URL: "http://localhost:5173"
      BACKEND_URL: "http://localhost:8000"
      SECRET_KEY: "ci-fake-secret-key-0123456789-0123456789-0123456789"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MERCADO_PAGO_ACCESS_TOKEN: "TEST-fake-token-for-ci"
      MERCADO_PAGO_WEBHOOK_SECRET: "fake-webhook-secret-for-ci"
      VALIDATE_WEBHOOK_SIGNATURE: "false"
      SMTP_HOST: "localhost"
      SMTP_PORT: "2525"
      SMTP_USER: "fake-user"
      SMTP_PASSWORD: "fake-password"
      SMTP_FROM: "ci@example.com"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Testes (pytest)
        # A suíte roda com sqlite em memória e não precisa de Postgres nem Redis.
        # Os testes marcados como `integration` exigem Postgres real e são
        # deselecionados por padrão via addopts em pyproject.toml.
        # As settings obrigatórias vêm do `env:` deste job (ver acima).
        run: pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/Papiro

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/Papiro/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Build (vite)
        run: npm run build

  # Só roda se backend e frontend passarem — evita gastar ~5 min de E2E quando
  # um lint trivial já quebrou.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookcommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Settings (app/core/config.py) exige estas variáveis sem default.
      # Valores fictícios: nenhum teste E2E chama serviço externo real
      # (ViaCEP e Mercado Pago são mockados via page.route).
      # Aspas obrigatórias: valores com ':' não-citados quebram o YAML.
      FRONTEND_URL: "http://localhost:5173"
      BACKEND_URL: "http://localhost:8000"
      SECRET_KEY: "ci-fake-secret-key-0123456789-0123456789-0123456789"
      ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: "15"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      MERCADO_PAGO_ACCESS_TOKEN: "TEST-fake-token-for-ci"
      MERCADO_PAGO_WEBHOOK_SECRET: "fake-webhook-secret-for-ci"
      VALIDATE_WEBHOOK_SIGNATURE: "false"
      SMTP_HOST: "localhost"
      SMTP_PORT: "2525"
      SMTP_USER: "fake-user"
      SMTP_PASSWORD: "fake-password"
      SMTP_FROM: "ci@example.com"
      CELERY_BROKER_URL: "redis://localhost:6379/0"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/1"
      E2E_DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/bookcommerce_e2e"
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@localhost:5432/bookcommerce_e2e"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/Papiro/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Aplicar migrations no banco de teste
        # alembic.ini e a pasta alembic/ ficam na RAIZ do repo (não em backend/).
        # O env.py lê DATABASE_URL via get_settings(), que vem do env do job.
        # `python -m alembic` em vez de `alembic`: não depende do console script
        # estar no PATH (neste venv local ele não está).
        run: python -m alembic upgrade head

      - name: Popular o banco (4 categorias, 24 produtos)
        working-directory: backend
        run: python -m scripts.seed

      - name: Instalar dependências do frontend
        working-directory: frontend/Papiro
        run: npm ci

      - name: Instalar Chromium do Playwright
        working-directory: frontend/Papiro
        run: npx playwright install --with-deps chromium

      - name: Rodar testes E2E
        working-directory: frontend/Papiro
        run: npx playwright test

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/Papiro/playwright-report/
          retention-days: 7
